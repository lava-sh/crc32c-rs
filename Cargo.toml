[package]
name = "crc32c-rs"
version = "0.0.1"
edition = "2024"
license = "Unlicense"
repository = "https://github.com/lava-sh/crc32c-rs"

[lib]
name = "_crc32c_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = {
    version = "=0.29.2",
    features = ["nightly"]
}

# mimalloc v3
[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
mimalloc = {
    optional = true,
    version = "=0.1.52",
    features = [
        "override",
        "local_dynamic_tls",
    ]
}

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = {
    optional = true,
    version = "=0.1.52",
    # See: https://github.com/lava-sh/toml-rs/issues/229
    #
    # mimalloc "override" feature installs process-wide malloc interposition and
    # replaces macOS malloc zone/fork hooks when the extension is imported via dlopen.
    # That breaks fork-based subprocess spawning, e.g., asyncio/playwright can fail.
    features = ["local_dynamic_tls"]
}

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = {
    optional = true,
    version = "=0.1.52",
    features = [],
}

[features]
default = []
mimalloc = ["dep:mimalloc"]

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
strip = "symbols"
codegen-units = 1

[lints.rust]
warnings = "deny"

[lints.clippy]
perf        = { level = "deny", priority = -1 }
style       = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
nursery     = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
suspicious  = { level = "warn", priority = -1 }

inline_always = "allow"
cast_possible_truncation = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"

# FIXME: remove after PyO3 0.29.3 is released
# See: https://github.com/PyO3/pyo3/pull/6309
clone_on_copy = "allow"

# Maybe "TODO"
missing_safety_doc = "allow"