name: "WebAssembly"

on:
  workflow_call:

env:
  __is_pull_request: &is_pull_request ${{ github.event_name == 'pull_request' }}
  #
  __rust_nightly: &rust-nightly "nightly-2026-10-25"

jobs:
  wasm:
    name: "wasm32-unknown-emscripten / python ${{ matrix.platform.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # See: https://github.com/pyodide/pyodide/blob/main/metadata/pyodide-cross-build-environments-v2.json
        platform:
          - python-version: "3.13"
            # 0.28.0a3 - 0.29.5 (emscripten 4.0.9)
            pyodide-version: "0.29.5"
            pyemscripten-version: "2025_0"
            emsdk-version: "4.0.9"
            rust-toolchain: *rust-nightly
            rustflags: >-
              -C link-arg=-sSIDE_MODULE=2
              -C link-arg=-sWASM_BIGINT
              -C relocation-model=pic
              -Z link-native-libraries=no
              -C symbol-mangling-version=v0

          - python-version: "3.14"
            # 314.0.0a1 - 314.0.7 (emscripten 5.0.3)
            pyodide-version: "314.0.7"
            pyemscripten-version: "2026_0"
            emsdk-version: "5.0.3"
            rust-toolchain: *rust-nightly
            rustflags: >-
              -C link-arg=-sSIDE_MODULE=2
              -C link-arg=-sWASM_BIGINT
              -C relocation-model=pic
              -Z link-native-libraries=no
              -C symbol-mangling-version=v0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: "Install Emscripten SDK"
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ matrix.platform.emsdk-version }}

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: *is_pull_request

      - name: "Build WASM wheel"
        uses: PyO3/maturin-action@5a53eda5f3db5f86b7ec4fc043d77151350f5c74 # v1.51.0
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS: ${{ matrix.platform.rustflags }}
          MATURIN_PYEMSCRIPTEN_PLATFORM_VERSION: ${{ matrix.platform.pyemscripten-version }}
        with:
          container: off
          rust-toolchain: ${{ matrix.platform.rust-toolchain }}
          docker-options: -e CI
          kache: *is_pull_request
          kache-version: "v2.0.0-rc.1"
          args: >-
            --out dist
            --release
            --target wasm32-unknown-emscripten
            --interpreter python${{ matrix.platform.python-version }}
            --compatibility pypi

      - name: "Download pyodide"
        uses: pyodide/pyodide-actions/download-pyodide@012fa537869d343726d01863a34b773fc4d96a14 # v2
        with:
          to: pyodide-dist
          version: ${{ matrix.platform.pyodide-version }}

      - name: "Test wasm wheel"
        run: |
          uv venv .venv --python ${{ matrix.platform.python-version }}
          uv pip install --group wasm-tests
          source .venv/bin/activate
          cp dist/*.whl pyodide-dist/
          pytest tests/test_wasm.py --runtime node --dist-dir pyodide-dist -v --noconftest

      - name: "Upload wasm wheel"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-wasm-${{ matrix.platform.python-version }}
          path: dist
