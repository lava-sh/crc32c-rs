name: "Bump Python dependencies"

permissions: { }

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  update:
    name: "update deps"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # needed to create-pull-request to push the branch
      contents: write
      # needed to create-pull-request to open the PR
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: "Bump Python dependencies"
        run: >-
          uv run 
          --no-project 
          --script https://gist.githubusercontent.com/chirizxc/c6938c1fed05cd039dda32f011fd4286/raw/script.py
          --pyproject-path "${{ github.workspace }}/pyproject.toml"

      - name: "Create PR"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: "chore(deps): bump python dependencies"
          title: "chore(deps): bump python dependencies"
          branch: "chore/update-deps"
          delete-branch: true
          add-paths: |
            pyproject.toml