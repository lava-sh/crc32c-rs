name: "CodSpeed"

permissions: { }

on:
  push:
    branches: [
      "main",
    ]
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always
  # The `release` profile strips symbols, which would leave CodSpeed without any
  # function names. Keep them, plus line tables, so the flame graphs stay readable.
  CARGO_PROFILE_RELEASE_STRIP: "none"
  CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"

jobs:
  benchmarks:
    name: "benchmarks / python 3.13"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Used to authenticate with CodSpeed through OpenID Connect
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: "Create and activate .venv"
        run: |
          uv venv .venv --python 3.13
          echo ".venv/bin" >> "$GITHUB_PATH"
          echo "PYO3_PYTHON=.venv/bin/python3" >> "$GITHUB_ENV"

      - name: "Install dependencies"
        run: uv pip install --group codspeed

      # The `mimalloc` feature is intentionally left out: its process-wide malloc
      # override conflicts with the allocator instrumentation used to measure the
      # benchmarks.
      - name: "Run maturin"
        run: maturin build --release --out wheels

      - name: "Install built wheel"
        run: uv pip install crc32c-rs --no-index --find-links wheels --force-reinstall

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: pytest benchmarks/ --codspeed
