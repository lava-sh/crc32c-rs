name: "CodSpeed"

permissions: { }

on:
  push:
    branches: ["main"]
    paths-ignore: [
      "CHANGELOG.md",
      "justfile",
    ]
  pull_request:
    paths-ignore: [
      "CHANGELOG.md",
      "justfile",
    ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    name: "benchmarks / ${{ matrix.runner }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # The simulation instrument runs under Valgrind, which 
          # CodSpeed only packages for Ubuntu 22.04 and 24.04
          - { runner: ubuntu-24.04,     mode: simulation }
          - { runner: ubuntu-24.04-arm, mode: simulation }

    permissions:
      contents: read
      # Used to authenticate with CodSpeed through OpenID Connect
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly # zizmor: ignore[unpinned-uses]

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name == 'pull_request'
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning]
          shared-key: codspeed-${{ matrix.runner }}

      - name: "Install cargo-codspeed"
        uses: taiki-e/install-action@main # zizmor: ignore[unpinned-uses]
        with:
          tool: cargo-codspeed@latest

      - name: "Build benchmarks"
        run: cargo codspeed build --measurement-mode ${{ matrix.mode }} --package crc32c-benchmarks

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: ${{ matrix.mode }}
          run: cargo codspeed run --package crc32c-benchmarks
