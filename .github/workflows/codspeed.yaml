name: "CodSpeed"

permissions: { }

on:
  push:
    branches: ["main"]
    paths-ignore: [
      "CHANGELOG.md",
      "justfile",
    ]
  pull_request:
    paths-ignore: [
      "CHANGELOG.md",
      "justfile",
    ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    name: "benchmarks / ${{ matrix.runner }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # The simulation instrument runs under Valgrind, which 
          # CodSpeed only packages for Ubuntu 22.04 and 24.04
          - { runner: ubuntu-24.04,     mode: simulation }
          - { runner: ubuntu-24.04-arm, mode: simulation }

    permissions:
      contents: read
      # Used to authenticate with CodSpeed through OpenID Connect
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly # zizmor: ignore[unpinned-uses]

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        if: github.event_name == 'pull_request'
        with:
          pr-comment: false
          github-cache: true
          cache-executables: true
          cache-dir: ${{ runner.temp }}/kache
          cache-key-prefix: kache-${{ matrix.runner }}

      - name: "Install cargo-codspeed"
        uses: taiki-e/install-action@main # zizmor: ignore[unpinned-uses]
        with:
          tool: cargo-codspeed@latest

      - name: "Build benchmarks"
        run: cargo codspeed build --measurement-mode ${{ matrix.mode }} --package crc32c-benchmarks

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # v5.6.1
        with:
          mode: ${{ matrix.mode }}
          run: cargo codspeed run --package crc32c-benchmarks
