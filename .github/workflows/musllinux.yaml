name: "musllinux"

on:
  workflow_call:

env:
  __interpreters: &interpreters "3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11"
  #
  __is_pull_request: &is_pull_request ${{ github.event_name == 'pull_request' }}

jobs:
  musllinux:
    name: "${{ matrix.platform.runner }} / ${{ matrix.platform.target }}"
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Rust target `loongarch64-unknown-linux-musl` is not supported by PyPI
        #
        # Rust targets `s390x-unknown-linux-musl`, `powerpc64-unknown-linux-musl`
        # is not available for cross-compilation (only supported for manylinux)
        #
        # See: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        platform:
          - {
            # AMD64
            runner: ubuntu-latest,
            target: x86_64-unknown-linux-musl,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc"
          }
          - {
            # x86 (32-bit)
            runner: ubuntu-latest,
            target: i686-unknown-linux-musl,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc"
          }
          - {
            # ARM64
            runner: ubuntu-26.04-arm,
            target: aarch64-unknown-linux-musl,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc"
          }
          - {
            # ARMv7 (32-bit)
            runner: ubuntu-latest,
            target: armv7-unknown-linux-musleabihf,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc"
          }
          - {
            # PowerPC64 Little Endian
            runner: ubuntu-latest,
            target: powerpc64le-unknown-linux-musl,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc"
          }
          - {
            # RISC-V 64-bit
            runner: ubuntu-latest,
            target: riscv64gc-unknown-linux-musl,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc"
          }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: *is_pull_request

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        if: *is_pull_request
        with:
          version: "v2.0.0-rc.1"
          pr-comment: false
          github-cache: true
          cache-executables: true
          cache-dir: ${{ runner.temp }}/kache
          cache-key-prefix: kache-${{ matrix.platform.target }}

      - name: "Locate kache binary"
        if: *is_pull_request
        run: echo "KACHE_BIN_DIR=$(dirname "$(command -v kache)")" >> "$GITHUB_ENV"

      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_2
          docker-options: >-
            -e CI
            -e RUSTC_WRAPPER=/kache-bin/kache
            -e KACHE_CACHE_DIR=/kache-store
            -e KACHE_RUNTIME_DIR=/kache-run
            -e KACHE_LOG
            -v ${{ runner.temp }}/kache:/kache-store
            -v ${{ env.KACHE_BIN_DIR }}:/kache-bin:ro
            -v /tmp/kache-run:/kache-run
          args: >-
            --release
            --out dist
            --interpreter ${{ matrix.platform.interpreter }}
            ${{ matrix.platform.maturin-build-args || '' }}
            --compatibility pypi

      - name: "kache stats"
        if: *is_pull_request
        run: kache stats --full

      - name: "Upload wheels"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
