name: "Android"

on:
  workflow_call:

env:
  __is_pull_request: &is_pull_request ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: "${{ matrix.platform.runner }} / ${{ matrix.platform.target }}"
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # See: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        platform:
          - {
            # AMD64
            runner: ubuntu-26.04,
            target: x86_64-linux-android,
          }
          - {
            # ARM64
            runner: ubuntu-26.04-arm,
            target: aarch64-linux-android,
          }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        if: *is_pull_request
        with:
          version: "v2.0.0-rc.1"
          pr-comment: false
          github-cache: true
          cache-executables: true
          cache-dir: ${{ runner.temp }}/kache
          cache-key-prefix: kache-${{ matrix.platform.target }}

      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: *is_pull_request

      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          ANDROID_API_LEVEL: 24
        with:
          container: off
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --out dist
            --features android
            --compatibility pypi

      - name: "kache stats"
        if: *is_pull_request
        run: kache stats --full

      - name: "Upload wheels"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-android-${{ matrix.platform.target }}
          path: dist
