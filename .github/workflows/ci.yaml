name: "CI"

permissions: { }

on:
  push:
    branches: ["main"]
    tags: ["*"]
    paths-ignore: [
      "CHANGELOG.md",
      "justfile",
    ]
  pull_request:
    types: [
      "synchronize",
      "opened", "reopened",
      "labeled", "unlabeled",
    ]
    paths-ignore: [
      "CHANGELOG.md",
      "justfile",
    ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always
  #
  __skip_tests: &skip_tests >- 
    ${{ !contains(github.event.pull_request.labels.*.name, 'skip: tests') }}
  __skip_lints: &skip_lints >-
    ${{ !contains(github.event.pull_request.labels.*.name, 'skip: lints') }}
  __is_pull_request: &is_pull_request ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-fmt:
    name: "cargo fmt"
    if: *skip_lints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly # zizmor: ignore[unpinned-uses]
        with:
          components: rustfmt

      - run: cargo fmt-nightly --check

  cargo-clippy:
    name: "cargo clippy / ${{ matrix.target }}"
    if: *skip_lints
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: windows-latest,   target: x86_64-pc-windows-msvc }
          - { runner: macos-26-intel,   target: x86_64-apple-darwin }
          - { runner: macos-latest,     target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: *is_pull_request
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning]
          shared-key: cargo-clippy-${{ matrix.target }}

      - uses: dtolnay/rust-toolchain@nightly # zizmor: ignore[unpinned-uses]
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - run: cargo clippy --target ${{ matrix.target }} --all-targets --all-features

  tools:
    name: ${{ matrix.name }}
    if: *skip_lints
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: "zizmor"
            command: zizmor .github/

          - name: "typos"
            command: typos --config typos.toml

          - name: "rumdl"
            command: rumdl check .

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # zizmor: ignore[cache-poisoning]
          enable-cache: *is_pull_request

      - name: "Install ${{ matrix.name }}"
        run: uv pip install --group ${{ matrix.name }} --system

      - name: "Run ${{ matrix.name }}"
        run: ${{ matrix.command }}

  tests-alpine:
    name: "tests / alpine / python 3.14"
    if: *skip_tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run build on alpine"
        run: |
          docker build -t alpine-test .github/scripts/alpine
          docker run --rm -v "$PWD":/app -w /app alpine-test

  tests:
    if: *skip_tests
    uses: $/.github/workflows/tests.yaml

  manylinux:
    if: >-
      ${{
          !contains(github.event.pull_request.labels.*.name, 'skip: wheels build') &&
          always() && !failure() && !cancelled() 
      }}
    needs: [ tests, tests-alpine, cargo-fmt, cargo-clippy, tools ]
    uses: $/.github/workflows/manylinux.yaml

  musllinux:
    if: >-
      ${{
          !contains(github.event.pull_request.labels.*.name, 'skip: wheels build') &&
          always() && !failure() && !cancelled() 
      }}
    needs: [ tests, tests-alpine, cargo-fmt, cargo-clippy, tools ]
    uses: $/.github/workflows/musllinux.yaml

  windows:
    if: >-
      ${{
          !contains(github.event.pull_request.labels.*.name, 'skip: wheels build') &&
          always() && !failure() && !cancelled() 
      }}
    needs: [ tests, tests-alpine, cargo-fmt, cargo-clippy, tools ]
    uses: $/.github/workflows/windows.yaml

  macos:
    if: >-
      ${{
          !contains(github.event.pull_request.labels.*.name, 'skip: wheels build') &&
          always() && !failure() && !cancelled() 
      }}
    needs: [ tests, tests-alpine, cargo-fmt, cargo-clippy, tools ]
    uses: $/.github/workflows/macos.yaml

  wasm:
    if: >-
      ${{
          !contains(github.event.pull_request.labels.*.name, 'skip: wheels build') &&
          always() && !failure() && !cancelled() 
      }}
    needs: [ tests, tests-alpine, cargo-fmt, cargo-clippy, tools ]
    uses: $/.github/workflows/wasm.yaml

  py-bench-x86:
    name: "py-bench / x86"
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'py-bench: x86')
      }}
    permissions:
      contents: read
      pull-requests: write
    uses: $/.github/workflows/py-bench.yaml
    with:
      runners: >-
        ["ubuntu-latest", "windows-latest", "macos-26-intel"]

  py-bench-aarch64:
    name: "py-bench / aarch64"
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'py-bench: aarch64')
      }}
    permissions:
      contents: read
      pull-requests: write
    uses: $/.github/workflows/py-bench.yaml
    with:
      runners: >-
        ["ubuntu-26.04-arm", "windows-11-arm", "macos-latest"]

  build-sdist:
    name: "build sdist"
    if: >-
      ${{ !contains(github.event.pull_request.labels.*.name, 'skip: wheels build') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Build sdist"
        uses: PyO3/maturin-action@5a53eda5f3db5f86b7ec4fc043d77151350f5c74 # v1.51.0
        with:
          command: sdist
          docker-options: -e CI
          args: --out dist

      - name: "Upload sdist"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  release-pypi:
    # if the python wheel build jobs are skipped, there are no artifacts to validate
    if: >-
      ${{
        always() && !failure() && !cancelled() &&
        !contains(github.event.pull_request.labels.*.name, 'skip: wheels build')
      }}

    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    needs: [
      build-sdist,
      manylinux,
      musllinux,
      windows,
      macos,
      wasm,
    ]
    environment: pypi
    permissions:
      # Used to sign the release's artifacts and upload to PyPI using trusted publisher
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: "Validate PyPI publication"
        run: uv publish 'wheels-*/*' --dry-run

      - name: "Generate PyPI publish attestations"
        if: github.ref_type == 'tag'
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: |
            wheels-*/*.whl
            wheels-*/*.tar.gz

      - name: "Publish to PyPI"
        if: github.ref_type == 'tag'
        run: uv publish --trusted-publishing=always 'wheels-*/*'

  release-github:
    if: ${{ github.ref_type == 'tag' && always() && !failure() && !cancelled() }}

    name: "Publish to GitHub Release"
    runs-on: ubuntu-latest
    needs: [
      build-sdist,
      manylinux,
      musllinux,
      windows,
      macos,
      wasm,
    ]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: "Generate artifact attestation"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "wheels-wasm-*/*.whl"

      - name: "Publish WASM wheels to GitHub Release"
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || \
          gh release create "$tag" --title "$tag" --notes ""
          gh release upload "$tag" wheels-wasm-*/*.whl --clobber
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
