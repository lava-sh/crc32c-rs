  big-endian:
    name: "big-endian / Python 3.14 / s390x"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup QEMU"
        run: docker run --rm --privileged multiarch/qemu-user-static:register --reset

      - name: "Build and test on s390x"
        uses: docker://multiarch/ubuntu-core:s390x-focal
        with:
          args: >
            bash -c
            "export DEBIAN_FRONTEND=noninteractive &&
            apt-get -y update &&
            apt-get -y install
            curl
            python3
            python3-venv
            python3-pip &&
            python3 -c 'import sys, platform; print(sys.version); print(platform.machine()); print(sys.byteorder); assert sys.byteorder == \"big\"' &&
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
            . \$HOME/.cargo/env &&
            cd /github/workspace &&
            python3 -m venv .venv &&
            . .venv/bin/activate &&
            pip install maturin pytest pytest-check &&
            maturin build --release --out wheels --features mimalloc &&
            pip install crc32c-rs --no-index --find-links wheels --force-reinstall &&
            pytest"